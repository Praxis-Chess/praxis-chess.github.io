<!-- THE CANONICAL IS THE NARRATIVE PAGE, NOT THIS ONE.
     The site used to be three documents; it is now one, and the process
     section lives inside it. This file exists so that /pipeline — bookmarked,
     linked, indexed — keeps working instead of 404ing, and it tells crawlers
     to credit the one real page rather than treating this as a duplicate. -->
<link rel="canonical" href="https://praxis-chess.github.io/" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />

<!-- THREE REDIRECTS, AND EACH COVERS A CASE THE OTHERS DO NOT.
     vercel.json and _redirects issue a real 308 at the edge, so on either
     host this file is never served at all. The script below is instant for
     anyone who reaches it anyway. The <meta refresh> is the floor: it is what
     fires with JavaScript disabled, and the visible link under it is what
     fires when even that is blocked. -->
<script>location.replace('/#pipeline');</script>
<meta http-equiv="refresh" content="0; url=/#pipeline" />
